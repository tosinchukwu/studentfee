name: Validate NEAR v3 contract

on:
  pull_request:
    branches: [main]
    paths:
      - "contracts/near-v3/**"
      - ".github/workflows/near-v3.yml"
  push:
    branches: ["feat/near-multischool-v3-contract"]
    paths:
      - "contracts/near-v3/**"
      - ".github/workflows/near-v3.yml"

permissions:
  contents: read

jobs:
  contract-tests:
    name: Rust unit tests (NEAR SDK 5.5.0)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install current stable Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/near-v3
      - name: Run v3 contract tests
        run: cargo test --manifest-path contracts/near-v3/Cargo.toml
      - name: Upload resolved Cargo lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: near-v3-cargo-lock
          path: contracts/near-v3/Cargo.lock
          if-no-files-found: error
      - name: Compile v3 WebAssembly target
        run: cargo build --manifest-path contracts/near-v3/Cargo.toml --target wasm32-unknown-unknown --release

name: Validate NEAR v3 contract

on:
  pull_request:
    branches: [main]
    paths:
      - "contracts/near-v3/**"
      - ".github/workflows/near-v3.yml"
  push:
    branches: ["feat/near-multischool-v3-contract"]
    paths:
      - "contracts/near-v3/**"
      - ".github/workflows/near-v3.yml"

permissions:
  contents: read

jobs:
  contract-tests:
    name: Rust unit tests (NEAR SDK 5.5.0)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install current stable Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/near-v3
      - name: Run v3 contract tests
        run: cargo test --manifest-path contracts/near-v3/Cargo.toml

name: Validate NEAR v3 contract

on:
  pull_request:
    branches: [main]
    paths:
      - "contracts/near-v3/**"
      - ".github/workflows/near-v3.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: near-v3-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  contract-tests:
    name: Rust unit tests (NEAR SDK 5.5.0)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Install current stable Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - name: Install NEAR protocol-compatible Rust 1.86.0
        run: rustup toolchain install 1.86.0 --profile minimal --target wasm32-unknown-unknown
      - name: Install pinned cargo-near
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/cargo-near-installer.sh -o /tmp/cargo-near-installer.sh
          echo "efbc260384a2e40c5690a6e0c5eae125eaa51347e38dfaaff07d342e704486f7  /tmp/cargo-near-installer.sh" | sha256sum -c -
          sh /tmp/cargo-near-installer.sh
          cargo near --version
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/near-v3
      - name: Run v3 contract tests
        run: cargo test --manifest-path contracts/near-v3/Cargo.toml -- --test-threads=1
      - name: Upload resolved Cargo lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: near-v3-cargo-lock
          path: contracts/near-v3/Cargo.lock
          if-no-files-found: error
      - name: Commit resolved Cargo.lock on the feature branch
        id: lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git add contracts/near-v3/Cargo.lock
          if ! git diff --cached --quiet -- contracts/near-v3/Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update NEAR v3 dependency lockfile"
            git push origin HEAD:refs/heads/${{ github.head_ref }}
            echo "committed=true" >> "$GITHUB_OUTPUT"
          else
            echo "committed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build optimized WebAssembly and generate ABI
        working-directory: contracts/near-v3
        run: cargo +1.86.0 near build non-reproducible-wasm --locked
      - name: Record optimized artifact hashes
        working-directory: contracts/near-v3
        run: |
          find target/near -type f \( -name '*.wasm' -o -name '*abi.json' \) -print
          find target/near -type f -name '*.wasm' -exec sha256sum {} \;
      - name: Upload optimized WebAssembly and ABI
        uses: actions/upload-artifact@v4
        with:
          name: near-v3-optimized-wasm-and-abi
          path: contracts/near-v3/target/near/**
          if-no-files-found: error
      - name: Run locked contract tests
        run: cargo test --locked --manifest-path contracts/near-v3/Cargo.toml -- --test-threads=1
      - name: Trigger validation on the lockfile commit
        if: steps.lockfile.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run near-v3.yml --ref "${{ github.head_ref || github.ref_name }}"

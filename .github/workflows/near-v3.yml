name: Validate NEAR v3 contract

on:
  pull_request:
    branches: [main]
    paths:
      - "contracts/near-v3/**"
      - ".github/workflows/near-v3.yml"
  push:
    branches: ["feat/near-multischool-v3-contract"]
    paths:
      - "contracts/near-v3/**"
      - ".github/workflows/near-v3.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  contract-tests:
    name: Rust unit tests (NEAR SDK 5.5.0)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install current stable Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - name: Install pinned cargo-near
        run: cargo install cargo-near --version 0.22.0 --locked
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/near-v3
      - name: Run v3 contract tests
        run: cargo test --manifest-path contracts/near-v3/Cargo.toml
      - name: Upload resolved Cargo lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: near-v3-cargo-lock
          path: contracts/near-v3/Cargo.lock
          if-no-files-found: error
      - name: Commit resolved Cargo.lock on the feature branch
        id: lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/near-multischool-v3-contract'
        run: |
          if ! git ls-files --error-unmatch contracts/near-v3/Cargo.lock >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add contracts/near-v3/Cargo.lock
            git commit -m "chore: lock NEAR v3 dependencies"
            git push origin HEAD:refs/heads/feat/near-multischool-v3-contract
            echo "committed=true" >> "$GITHUB_OUTPUT"
          else
            echo "committed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build optimized WebAssembly and generate ABI
        working-directory: contracts/near-v3
        run: cargo near build non-reproducible-wasm --locked
      - name: Record optimized artifact hashes
        working-directory: contracts/near-v3
        run: |
          find target/near -type f \\( -name '*.wasm' -o -name '*abi.json' \\) -print
          find target/near -type f -name '*.wasm' -exec sha256sum {} \\;
      - name: Upload optimized WebAssembly and ABI
        uses: actions/upload-artifact@v4
        with:
          name: near-v3-optimized-wasm-and-abi
          path: contracts/near-v3/target/near/**
          if-no-files-found: error
      - name: Run locked contract tests
        run: cargo test --locked --manifest-path contracts/near-v3/Cargo.toml
      - name: Trigger validation on the lockfile commit
        if: steps.lockfile.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run near-v3.yml --ref feat/near-multischool-v3-contract

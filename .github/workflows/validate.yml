name: Validate application and Demo contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]

permissions:
  contents: read

jobs:
  frontend:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build

  near-demo-contract:
    name: Compile public Demo contract for NEAR Wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust and Wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/near-demo
      - name: Compile Demo contract
        working-directory: contracts/near-demo
        run: cargo build --target wasm32-unknown-unknown --release
      - name: Upload compiled Demo Wasm
        uses: actions/upload-artifact@v4
        with:
          name: studentfee-demo-wasm
          path: contracts/near-demo/target/wasm32-unknown-unknown/release/studentfee_public_demo.wasm
          if-no-files-found: error
          retention-days: 7

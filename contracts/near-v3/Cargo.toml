[package]
name = "studentfee-registry-v3"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.5.0", features = ["legacy", "abi"] }
near-contract-standards = "=5.5.0"

[dev-dependencies]
near-sdk = { version = "=5.5.0", features = ["legacy", "abi", "unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true

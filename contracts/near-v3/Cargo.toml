[package]
name = "studentfee-registry-v3"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.5.0", features = ["legacy"] }
near-sys = "=0.2.9"
near-contract-standards = "=5.5.0"

# NEAR SDK 5.5.0's ABI schema dependency is host-only. Keep the ABI feature
# out of the wasm32 dependency graph so the optimized contract build does not
# try to resolve host-only schemars implementations.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
near-sdk = { version = "=5.5.0", features = ["legacy", "abi"] }

[dev-dependencies]
near-sdk = { version = "=5.5.0", features = ["legacy", "abi", "unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true
